  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    width:100%; height:100%;
    background:var(--bg);
    color:var(--green);
    font-family:'JetBrains Mono', monospace;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- ambient scanlines / vignette ---------- */
  .crt{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%),
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,255,133,.025) 3px,
        rgba(0,0,0,0) 4px
      );
    animation: flicker 7s infinite steps(1);
  }
  @keyframes flicker{
    0%,96%,100%{ opacity:1; }
    97%{ opacity:.85; }
    98%{ opacity:1; }
    99%{ opacity:.92; }
  }

  .noise-drift{
    position:fixed; inset:-10% -10%; pointer-events:none; z-index:49;
    background: linear-gradient(transparent 0%, rgba(0,255,133,.03) 50%, transparent 100%);
    height:200%;
    animation: drift 9s linear infinite;
  }
  @keyframes drift{
    from{ transform:translateY(-50%); }
    to{ transform:translateY(0%); }
  }

  /* ---------- frame ---------- */
  /* The panel is authored once at a fixed reference width (--design-w)
     and then uniformly scaled to fit whatever window/monitor it's
     shown on (see #fitStage script). The HEIGHT is intentionally not
     hardcoded — .stage sizes itself to whatever its content actually
     needs (height:auto), and the script measures that real height at
     runtime before scaling. That way, any future tweak to padding,
     margins, or gaps just works — the canvas always fits everything
     it contains, on any 4:3, 16:9, ultrawide, or portrait screen,
     instead of silently clipping content at the bottom. */
  .viewport{
    position:fixed; inset:0;
    width:100vw; height:100vh;
    background:var(--bg);
    overflow:hidden;
  }
  .stage{
    position:absolute;
    top: calc(50% - 6px); left:50%; 
    width:var(--design-w); height:auto;
    transform: translate(-50%,-50%);
    transform-origin:center center;
    display:flex; flex-direction:column;
    padding: 34px 46px 22px;
  }

  .bracket{
    position:fixed; width:26px; height:26px; z-index:40;
    border-color:var(--green-dim); opacity:.7;
  }
  .bracket.tl{ top:16px; left:16px; border-top:2px solid; border-left:2px solid; }
  .bracket.tr{ top:16px; right:16px; border-top:2px solid; border-right:2px solid; }
  .bracket.bl{ bottom:16px; left:16px; border-bottom:2px solid; border-left:2px solid; }
  .bracket.br{ bottom:16px; right:16px; border-bottom:2px solid; border-right:2px solid; }

  /* ---------- header ---------- */
  header{
    display:flex; flex-direction:column;
    padding-bottom:0;
  }

  .brandbar{
    display:flex; align-items:center; justify-content:flex-end;
    margin-bottom: 22px;
  }
  .brandbar .tag{
    font-size:11px; letter-spacing:3px; color:var(--green-dim);
  }
  .brand-footer{
    width:100%;
    text-align:center;
    margin-top:2em;
    font-size:24px; letter-spacing:.5px;
  }

  .wordmark-wrap{
    text-align:center;
    width:100%;
    /* The source artwork's own canvas (2170x725) has a lot of empty
       transparent space below the visible "AN LM-LINK PRODUCT" text
       (roughly the bottom 30%). Rather than cropping the image itself
       (which shrinks the box and throws off the mask/glow effects
       tuned for this exact scale), we just pull the next block up
       with a negative margin to visually close that gap. */
	margin-top: -40px;  
    margin-bottom: -86px;
  }

  .wordmark{
    position:relative;
    display:inline-block;
    width: var(--content-w);
    max-width: 100%;
    aspect-ratio: 2170 / 725;
    transform: skewX(-9deg);
    filter: drop-shadow(0 0 5px var(--logo-glow)) drop-shadow(0 0 12px rgba(0,40,20,.35));
    clip-path: polygon(
      0% 9%, 7% 2%, 14% 10%, 21% 3%, 28% 8%, 35% 1%, 42% 7%, 49% 0%,
      56% 8%, 63% 2%, 70% 9%, 77% 3%, 84% 8%, 91% 1%, 100% 6%,
      100% 91%, 93% 98%, 86% 90%, 79% 97%, 72% 92%, 65% 99%, 58% 93%,
      51% 100%, 44% 92%, 37% 98%, 30% 91%, 23% 97%, 16% 90%, 9% 98%, 0% 91%
    );
    -webkit-mask-image: repeating-linear-gradient(to bottom, black 0px, black 2px, transparent 3px, transparent 4px);
    mask-image: repeating-linear-gradient(to bottom, black 0px, black 2px, transparent 3px, transparent 4px);
    -webkit-mask-size: 100% 3.05px;
    mask-size: 100% 3.05px;
    animation: scanjit 4s steps(6) infinite;
  }
  @keyframes scanjit{
    0%,80%,100%{ -webkit-mask-position-y:0; mask-position-y:0; }
    82%{ -webkit-mask-position-y:2px; mask-position-y:2px; }
    84%{ -webkit-mask-position-y:0; mask-position-y:0; }
    86%{ -webkit-mask-position-y:-3px; mask-position-y:-3px; }
    88%{ -webkit-mask-position-y:0; mask-position-y:0; }
  }
  .wordmark > div{
    position:absolute; inset:0;
    background-image: var(--logo-img);
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }
  .wordmark .glitch-a{ animation: glitch1 5.2s infinite linear; opacity:.7; filter:brightness(1.55) saturate(1.1); }
  .wordmark .glitch-b{ animation: glitch2 6.1s infinite linear; opacity:.5; filter:brightness(.6); }
  @keyframes glitch1{
    0%,93%,100%{ clip-path: inset(0 0 100% 0); transform:translate(0,0); }
    94%{ clip-path: inset(20% 0 60% 0); transform:translate(-3px,0); }
    95%{ clip-path: inset(55% 0 10% 0); transform:translate(3px,0); }
    96%{ clip-path: inset(0 0 100% 0); }
  }
  @keyframes glitch2{
    0%,90%,100%{ clip-path: inset(0 0 100% 0); transform:translate(0,0); }
    91%{ clip-path: inset(70% 0 5% 0); transform:translate(3px,0); }
    92%{ clip-path: inset(10% 0 75% 0); transform:translate(-3px,0); }
    93%{ clip-path: inset(0 0 100% 0); }
  }

  .status-pill{
    display:inline-flex; align-items:center; gap:10px;
    padding:5px 12px;
    border:1px solid var(--green-faint);
    font-size:26px; letter-spacing:2px;
  }
  .dot{
    width:17px; height:17px; border-radius:50%;
    background:var(--green); box-shadow:0 0 20px var(--green);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .status-pill.offline .dot{ background:var(--red); box-shadow:0 0 8px var(--red); animation:none; }
  .status-pill.offline{ color:var(--red); border-color: rgba(255,68,68,.3); }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  /* ---------- grid ---------- */
  .panels-wrap{
    width: var(--content-w);
    max-width: 100%;
    margin: 16px auto auto auto;
    display:flex; flex-direction:column;
  }
  main{
    display:grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 0;
  }
  .panel{
    border-bottom:1px solid var(--green-faint);
    padding: 16px 34px;
    display:flex; flex-direction:column; justify-content:center;
    gap:14px;
  }
  main .panel:nth-child(3),
  main .panel:nth-child(4){ border-bottom:none; }

  .panel-head{
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .panel-head .label{
    font-size:27px; font-weight:700; letter-spacing:1px;
  }
  .panel-head .value{
    font-size:38px; font-weight:400; font-variant-numeric:tabular-nums;
    text-shadow:0 0 10px var(--green-glow);
  }
  .value.warn{ color:var(--amber); text-shadow:0 0 10px rgba(255,176,32,.4); }
  .value.crit{ color:var(--red); text-shadow:0 0 10px rgba(255,68,68,.4); }

  .bar-track{
    height:11px; border:1px solid var(--green-faint);
    position:relative; overflow:hidden;
  }
  .bar-fill{
    height:100%; width:0%;
    background:var(--green);
    box-shadow:0 0 8px var(--green-glow);
    transition: width .6s ease;
  }
  .bar-fill.warn{ background:var(--amber); box-shadow:0 0 8px rgba(255,176,32,.5); }
  .bar-fill.crit{ background:var(--red); box-shadow:0 0 8px rgba(255,68,68,.5); }

  .sub-line{
    font-size:23px; color:var(--green-dim); letter-spacing:.5px;
    display:flex; gap:24px; flex-wrap:wrap;
  }
  .sub-line b{ color:var(--green); font-weight:600; }

  .blink-bar{
    width:100%; height:20px;
    margin-top: 26px;
    border:1px solid var(--green-faint);
    background: rgba(0,255,133,.05);
    position:relative;
    overflow:hidden;
  }
  .blink-bar-fill{
    position:absolute; top:0; left:0; height:100%;
    background: var(--green);
    box-shadow: 0 0 10px var(--green-glow), 0 0 24px rgba(0,255,133,.25);
    animation: blinkbar 2s steps(1) infinite;
  }
  @keyframes blinkbar{
    0%, 49%{ width:80%; }
    50%, 100%{ width:100%; }
  }

  /* ---------- footer log ---------- */
  footer{
    border-top:1px solid var(--green-faint);
    padding-top:10px; margin-top:6px;
    height:26px; overflow:hidden; position:relative;
  }
  #logTrack{
    position:absolute; white-space:nowrap;
    font-size:12px; letter-spacing:1.5px; color:var(--green-dim);
  }

  /* No breakpoint media queries needed: the whole .stage canvas is
     scaled uniformly to fit any viewport (see #fitStage script), so
     the same composition looks right on phones, 4:3 monitors and
     ultrawide screens alike. */
</style>
</head>
<body>

  <div class="crt"></div>
  <div class="noise-drift"></div>
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>

  <div class="viewport">
  <div class="stage" id="stage">

    <header>
      <div class="brandbar">
        <div class="status-pill offline" id="statusPill">
          <span class="dot"></span><span id="statusText">SYNCING</span>
        </div>
      </div>
    </header>

    <div class="panels-wrap">
      <div class="wordmark-wrap">
        <div class="wordmark" role="img" aria-label="SEVASTOLINK — AN LM-LINK PRODUCT">
          <div class="logo-base"></div>
          <div class="glitch-a" aria-hidden="true"></div>
          <div class="glitch-b" aria-hidden="true"></div>
        </div>
      </div>
      <main>
        <div class="panel">
          <div class="panel-head"><span class="label">CPU</span><span class="value" id="cpuVal">--%</span></div>
          <div class="bar-track"><div class="bar-fill" id="cpuBar"></div></div>
          <div class="sub-line"><span>TEMP <b id="tempVal">-- C</b></span></div>
        </div>

        <div class="panel">
          <div class="panel-head"><span class="label">MEMORY</span><span class="value" id="ramVal">--%</span></div>
          <div class="bar-track"><div class="bar-fill" id="ramBar"></div></div>
          <div class="sub-line"><span>SWAP <b id="swapVal">--%</b></span></div>
        </div>

        <div class="panel">
          <div class="panel-head"><span class="label">STORAGE</span><span class="value" id="diskVal">--%</span></div>
          <div class="bar-track"><div class="bar-fill" id="diskBar"></div></div>
          <div class="sub-line"><span id="diskUsage"><b>--</b> / -- GB</span></div>
        </div>

        <div class="panel">
          <div class="panel-head"><span class="label">NETWORK</span></div>
          <div class="sub-line"><span>IP <b id="ipVal">--</b></span></div>
          <div class="sub-line">
            <span>DL <b id="dlVal">-- MB/s</b></span>
            <span>UL <b id="ulVal">-- MB/s</b></span>
          </div>
        </div>
      </main>
      <div class="blink-bar"><div class="blink-bar-fill"></div></div>
      <div class="brand-footer">(C) LM-LINK DATA SYSTEMS</div>
	  <br>
    </div>

    <footer>
      <div id="logTrack">INITIALIZING TELEMETRY LINK ...</div>
    </footer>

  </div>
  </div>

<script>
  // ---------------------------------------------------------
  // Scale-to-fit: the panel is designed once at a fixed reference
  // width (DESIGN_W) and this scales the whole canvas up/down to
  // fill whatever window it's shown in, centered, letterboxed with
  // the same background color. This is what makes the layout look
  // identical (same gaps, same proportions) at 4:3, 16:9, ultrawide,
  // portrait, etc.
  //
  // The canvas HEIGHT is measured live from the actual content
  // (stage.offsetHeight) instead of being hardcoded. CSS `transform`
  // never affects offsetHeight — it only visually scales/moves the
  // element — so this always reflects the true, un-scaled height of
  // everything inside .stage, no matter how the spacing/margins are
  // tweaked later. That's what stops elements at the bottom (the
  // blink bar, "(C) LM-LINK DATA SYSTEMS", the log ticker) from
  // silently getting clipped off by .viewport's overflow:hidden.
  // ---------------------------------------------------------
  (function(){
    const stage = document.getElementById('stage');
    const DESIGN_W = 1024;
    function fitStage(){
      const designH = stage.offsetHeight;
      const scale = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / designH);
      stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    window.addEventListener('resize', fitStage);
    fitStage();
  })();
</script>
<script>
  // ---------------------------------------------------------
  // CONFIG — aponte para a mesma API que o update_api.ps1 usava
  // ---------------------------------------------------------
  const API_URL = "http://server:8181/api/rainmeter";
  const POLL_MS = 2000;

  const el = id => document.getElementById(id);
  const pill = el('statusPill');
  const statusText = el('statusText');
  const logTrack = el('logTrack');

  let logLines = ["TELEMETRY LINK INITIALIZING..."];

  function pushLog(msg){
    const t = new Date().toLocaleTimeString('pt-BR', {hour12:false});
    logLines.push(`[${t}] ${msg}`);
    if (logLines.length > 12) logLines.shift();
    renderLog();
  }

  function renderLog(){
    logTrack.textContent = logLines.join('     //     ');
  }

  function tierClass(val, warnAt, critAt){
    if (val >= critAt) return 'crit';
    if (val >= warnAt) return 'warn';
    return '';
  }

  function setMetric(prefix, val, {warnAt=70, critAt=90, suffix='%'} = {}){
    const v = Number(val);
    const cls = tierClass(v, warnAt, critAt);
    const valueEl = el(prefix + 'Val');
    const barEl = el(prefix + 'Bar');
    if (valueEl){
      valueEl.textContent = (isFinite(v) ? v.toFixed(1) : '--') + suffix;
      valueEl.className = 'value ' + cls;
    }
    if (barEl){
      barEl.style.width = Math.min(100, Math.max(0, v)) + '%';
      barEl.className = 'bar-fill ' + cls;
    }
  }

  function parseApiText(text){
    const data = {};
    text.split('\n').forEach(line => {
      const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.+?)\s*$/);
      if (m) data[m[1]] = m[2];
    });
    return data;
  }

  async function poll(){
    try{
      const res = await fetch(API_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const d = parseApiText(text);

      if (d.ERROR){ throw new Error(d.ERROR); }

      setMetric('cpu', d.CPU_USAGE, {warnAt:70, critAt:90});
      setMetric('ram', d.RAM_PERCENT, {warnAt:75, critAt:92});
      setMetric('disk', d.DISK_PERCENT, {warnAt:80, critAt:95});

      const temp = Number(d.CPU_TEMP);
      const tempEl = el('tempVal');
      tempEl.textContent = (isFinite(temp) ? temp.toFixed(1) : '--') + ' C';
      if (temp >= 85){
        tempEl.style.color = 'var(--red)';
        tempEl.style.textShadow = '0 0 10px rgba(255,68,68,.4)';
      } else if (temp >= 58){
        tempEl.style.color = 'var(--amber)';
        tempEl.style.textShadow = '0 0 10px rgba(255,176,32,.4)';
      } else {
        tempEl.style.color = 'var(--green)';
        tempEl.style.textShadow = 'none';
      }

      el('swapVal').textContent = (d.SWAP_PERCENT ?? '--') + '%';
      el('diskUsage').innerHTML = `<b>${d.DISK_USED ?? '--'}</b> / ${d.DISK_TOTAL ?? '--'} GB`;
      el('ipVal').textContent = d.LAN_IP ?? '--';
      el('dlVal').textContent = (d.DOWNLOAD ?? '--') + ' MB/s';
      el('ulVal').textContent = (d.UPLOAD ?? '--') + ' MB/s';

      pill.classList.remove('offline');
      statusText.textContent = 'ONLINE';
      pushLog('TELEMETRY SYNC OK');
    }catch(err){
      pill.classList.add('offline');
      statusText.textContent = 'LINK LOST';
      pushLog('SYNC FAILED — ' + err.message);
    }
  }

  poll();
  setInterval(poll, POLL_MS);
</script>

</body>
</html>
